# Docker Compose for AI4S Research Agent (Phase 6)
#
# Usage (from repo root):
#   cp .env.example .env   # fill DEEPSEEK_API_KEY
#   docker compose -f docker/docker-compose.yml up --build
#
# Data persists in ../data (sessions.db, mcp_files, chroma).

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - ../.env
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      LOG_FORMAT: json
      SESSION_DB_PATH: /app/data/sessions.db
      MCP_ALLOWED_DIRS: /app/data/mcp_files
      RAG_CHROMA_PATH: /app/data/chroma
      MCP_CONFIG_PATH: /app/mcp_servers.json
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
