# Docker Compose for AI4S Research Agent
#
# 用法（仓库根目录）：
#   cp conf/.env.example conf/.env   # 填入 DEEPSEEK_API_KEY
#   docker compose -f docker/docker-compose.yml up -d --build

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - ../conf/.env
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      LOG_FORMAT: json
      SESSION_DB_PATH: /repo/data/sessions.db
      MCP_ALLOWED_DIRS: /repo/data/mcp_files
      RAG_CHROMA_PATH: /repo/data/chroma
      MCP_CONFIG_PATH: /repo/conf/mcp_servers.json
    volumes:
      - ../data:/repo/data
      - ../log:/repo/log
      - ../conf:/repo/conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
