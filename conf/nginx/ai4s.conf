# AI4S Research Agent — Nginx（HTTP + 自签名 HTTPS）
#
# 安装（仓库根目录，路径按实际修改）：
#   ./scripts/gen-self-signed-cert.sh 47.112.10.62
#   cp conf/nginx/ai4s.conf /etc/nginx/sites-available/ai4s
#   # 若证书不在默认路径，改下面 ssl_certificate* 为绝对路径，例如：
#   #   ssl_certificate     /root/ai4s-research-agent/conf/ssl/cert.pem;
#   #   ssl_certificate_key /root/ai4s-research-agent/conf/ssl/key.pem;
#   ln -sf /etc/nginx/sites-available/ai4s /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# 安全组放行 80、443。浏览器访问 https://公网IP （首次需信任自签名证书）

upstream ai4s_backend {
    server 127.0.0.1:8000;
    keepalive 8;
}

# HTTP → HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS（自签名）
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # 请改成服务器上的绝对路径
    ssl_certificate     /root/ai4s-research-agent/conf/ssl/cert.pem;
    ssl_certificate_key /root/ai4s-research-agent/conf/ssl/key.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 自签名演示站：可放宽 HSTS；正式站再启用
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://ai4s_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;        # SSE 必须关
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
