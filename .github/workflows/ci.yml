name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev,pdf,docx,export]"

      - name: Run pytest
        env:
          DEEPSEEK_API_KEY: sk-test-key-for-ci
        run: pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend for E2E
        run: |
          cd ../..
          pip install -e ".[dev,pdf,docx,export]"

      - name: Install and build frontend
        run: |
          npm ci
          npm run build
          npx playwright install chromium --with-deps

      - name: Playwright E2E
        env:
          DEEPSEEK_API_KEY: sk-test-key-for-ci
        run: npm run test:e2e
