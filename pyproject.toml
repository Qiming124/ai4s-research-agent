[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4s-research-agent"
version = "2.2.0"
description = "AI4S 理论侧多智能体 — 文献 / 推导 / 实验建议（DL-for-Science）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.55.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "httpx-sse>=0.4.0",
    "rich>=13.9.0",
    "prompt-toolkit>=3.0.48",
    "python-dotenv>=1.0.1",
    "mcp>=1.0",
    "langchain>=0.3.0,<0.4",
    "langchain-core>=0.3.0,<0.4",
    "langchain-openai>=0.3.0,<0.4",
    "langgraph>=0.2.0,<0.3",
    "langchain-mcp-adapters>=0.1.0,<0.2",
    "langgraph-checkpoint-sqlite>=2.0.0,<3",
    "chromadb>=0.5.0,<0.6",
    "sympy>=1.13.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pyyaml>=6.0.0",
    "openpyxl>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]
rag = [
    "sentence-transformers>=3.0.0,<4",
]
numerical = [
    "torch>=2.2.0",
]
pdf = [
    "pypdf>=4.0.0",
]
docx = [
    "python-docx>=1.1.0",
]
export = [
    "python-docx>=1.1.0",
    "fpdf2>=2.8.0",
    "reportlab>=4.0.0",
]

[project.scripts]
research-agent-cli = "client.cli:main"

[tool.setuptools.packages.find]
where = ["app"]
include = ["server*", "client*", "shared*"]

[tool.setuptools.package-data]
"server.export" = ["fonts/*.otf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["app", "."]
