[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4s-research-agent"
version = "0.1.0"
description = "AI4S 科研辅助多智能体系统 — Phase 1 DeepSeek 对话 Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.55.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "httpx-sse>=0.4.0",
    "rich>=13.9.0",
    "prompt-toolkit>=3.0.48",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
research-agent-cli = "client.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*", "client*", "shared*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
